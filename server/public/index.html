<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo-booth</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
</head>
<body>
    <h1 class="title">Photo-booth</h1>
    <a class="subtitle" href="clients/windows/Photo-booth-Release-0.2.zip">Télécharger le client (Windows)</a>
    <a class="subtitle" href="clients/linux/Photo-booth-x86_64-v0.2.AppImage">Télécharger le client (Linux)</a>
    <a class="subtitle" href="clients/mac/Photo-booth-v0.2.zip">Télécharger le client (Mac)</a>

    <div class="infos"> 
         <div class="checkbox-container">    
            <input type="checkbox" class="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox-label">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
                <span class="ball"></span>
            </label>
        </div>

        <div class="user-count">
            <p>Clients connectés : <span id="userCount" style="color: red;">0</span></p>
            <button id="reload"><i class="fa-solid fa-arrow-rotate-right"></i></button>
        </div>       
    </div>

    <select id="cameraOption">
        <option value="" disabled selected>Choisir une caméra</option>
    </select>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline></video>
        <canvas id="photoCanvas" class="hidden"></canvas>
    </div>
    <input type="text" id="caption" placeholder="Entrez une légende" maxlength="40">

    <div class="buttons-box" id="capture">
        <button id="photoButton" class="floating-button" aria-label="Photo mode">
            <img src="/icons/photo-icon.png" alt="Photo icon">
        </button>
        <button id="importBtn" class="floating-button" aria-label="Import image">
            <img src="/icons/import-icon.png" alt="Import">
        </button>
        <input type="file" id="importInput" accept="image/*" class="hidden">
    </div>

    <div class="buttons-box hidden" id="validation-buttons">
        <button id="valid" class="floating-button">
            <img src="icons/check-icon.png" alt="Valider">
        </button>
        <button id="delete" class="floating-button">
            <img src="icons/cross-icon.png" alt="Annuler">
        </button>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</body>

<script type="module" src="scripts/main.js"></script>
</html>
