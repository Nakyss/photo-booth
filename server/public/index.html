<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Photo-booth</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
</head>
<body>
    <h1 class="title">Photo-booth</h1>
    <a class="subtitle" href="Photo-booth-Release-0.1.zip">Télécharger le client (Windows)</a>

    <div class="video-container">
        <video id="cameraStream" autoplay playsinline></video>
        <canvas id="photoCanvas" class="hidden"></canvas>
    </div>
    
    <button id="photoButton" class="floating-button" aria-label="Photo mode">
        <img src="/icons/photo-icon.png" alt="Photo icon">
    </button>

    <div class="validation-buttons hidden">
        <button id="valid" class="floating-button">
            <img src="icons/check-icon.png" alt="Photo icon">
        </button>
        <button id="delete" class="floating-button">
            <img src="icons/cross-icon.png" alt="Photo icon">
        </button>
    </div>
</body>


<script>
    const video = document.getElementById('cameraStream');
    const canvas = document.getElementById('photoCanvas');
    const photoButton = document.getElementById('photoButton');
    const validationsButtons = document.querySelector('.validation-buttons');
    const ctx = canvas.getContext('2d');

    const startCamera = async () =>{
        try {
            video.srcObject = await navigator.mediaDevices.getUserMedia({video: true});
        } catch (err) {
            console.error("Erreur d'accès à la caméra:", err);
            alert("Impossible d'accéder à la caméra.");
        }
    }

    const capturePhoto = () => {
        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(video, 0, 0, width, height);

        video.classList.add('hidden');
        canvas.classList.remove('hidden');
        photoButton.classList.add('hidden');
        validationsButtons.classList.remove('hidden');
    }


    // Convertit le canvas en Blob et envoie en multipart/form-data à /upload
    const uploadCapturedPhoto = () => {
        return new Promise((resolve, reject) => {
            canvas.toBlob(async (blob) => {
                if (!blob) return reject(new Error('Impossible de créer le blob'));
                const form = new FormData();
                form.append('image', blob, `photo-${Date.now()}.png`);
                form.append('message', '');

                try {
                    const res = await fetch('/upload', {
                        method: 'POST',
                        body: form
                    });
                    if (!res.ok) {
                        const err = await res.text();
                        return reject(new Error(err || 'Erreur lors de l\'upload'));
                    }
                    const json = await res.json();
                    resolve(json);
                } catch (e) {
                    reject(e);
                }
            }, 'image/png');
        });
    }

    document.addEventListener('DOMContentLoaded', startCamera);

    photoButton.addEventListener('click', async () => {
        capturePhoto();
    });

    document.getElementById('valid').addEventListener('click', async () => {
        try {
            const result = await uploadCapturedPhoto();
            console.log('Upload réussi:', result);
            // Remettre la caméra et cacher le canvas
            canvas.classList.add('hidden');
            video.classList.remove('hidden');
            validationsButtons.classList.add('hidden');
            photoButton.classList.remove('hidden');
        } catch (err) {
            console.error('Upload échoué:', err);
            alert('Échec de l\'upload.');
            // remettre la caméra pour retenter
            canvas.classList.add('hidden');
            video.classList.remove('hidden');
            validationsButtons.classList.add('hidden');
            photoButton.classList.remove('hidden');
        }
    });

    document.getElementById('delete').addEventListener('click', () => {
        canvas.classList.add('hidden');
        video.classList.remove('hidden');
        validationsButtons.classList.add('hidden');
        photoButton.classList.remove('hidden');
    });

</script>
</html>
