<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo-booth</title>

    <link rel="stylesheet" href="styles/main.css">
    <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Title + Download -->
    <h1 class="title">Photo-booth</h1>
    <a href="/installation_guide" class="download-btn">Télécharger le client</a>
    <a href="/client" class="download-btn">Client en ligne</a>

    <!-- Top bar -->
    <div class="infos">
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox-label">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
                <span class="ball"></span>
            </label>
        </div>
    </div>

    <!-- User count (absolute top right) -->
    <div class="user-count">
        <p>Clients connectés : <span id="userCount" style="color: red;">0</span></p>
        <button id="reload"><i class="fa-solid fa-arrow-rotate-right"></i></button>
    </div>

    <!-- CENTRAL WRAPPER -->
    <div class="center-wrapper">

        <!-- Camera selector -->
        <select id="cameraOption">
            <option value="" disabled selected>Choisir une caméra</option>
        </select>

        <!-- Video preview -->
        <div class="video-container">
            <video id="cameraStream" autoplay playsinline></video>
            <canvas id="photoCanvas" class="hidden"></canvas>
        </div>

        <!-- Caption input -->
        <input type="text" id="caption" placeholder="Entrez une légende" maxlength="100">

        <!-- Floating action buttons -->
        <div class="buttons-box" id="capture">
            <button id="timerBtn" class="floating-button" aria-label="Minuterie" title="Retardateur (3sec)">
                <img src="/icons/timer-icon.svg" alt="minuteur">
            </button>
            <button id="photoButton" class="floating-button" aria-label="Photo mode" title="Prendre une photo">
                <img src="/icons/photo-icon.svg" alt="Photo icon">
            </button>
            <button id="importBtn" class="floating-button" aria-label="Import image" title="Importer une photo">
                <img src="/icons/import-icon.svg" alt="Import">
            </button>
            <button id="inverseBtn" class="floating-button" aria-label="Inverser l'image" title="Inverser l'image (preview)">
                <img src="/icons/inverse-icon.svg" alt="mirror">
            </button>
            <input type="file" id="importInput" accept="image/*" class="hidden">
        </div>

        <!-- Validation buttons -->
        <div class="buttons-box hidden" id="validation-buttons">
            <button id="valid" class="floating-button" title="Envoyer l'image">
                <img src="icons/check-icon.svg" alt="Valider">
            </button>
            <button id="delete" class="floating-button" title="Annuler">
                <img src="icons/cross-icon.svg" alt="Annuler">
            </button>
        </div>
    </div>

    <!-- Notifications -->
    <div class="toolbox"></div>

    <script type="module" src="scripts/main.js"></script>
</body>
</html>
