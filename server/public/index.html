<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo-booth</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/svg+xml" href="icons/photo-booth-icon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <h1 class="title">Photo-booth</h1>
 
    <div class="header">
        <a href="/installation_guide" class="top-btn">Télécharger le client</a>
        <a href="/client" class="top-btn">Client en ligne</a>
    </div>

    <div class="top-bar">
        <div class="infos">
            <div class="checkbox-container">
                <input type="checkbox" class="checkbox" id="checkbox">
                <label for="checkbox" class="checkbox-label">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                    <span class="ball"></span>
                </label>
            </div>
        </div>

        <div class="user-count">
            <span id="userCount" style="color: red;">0</span>
            <p>Clients<br>connectés</p>
            <button id="reload"><i class="fa-solid fa-arrow-rotate-right"></i></button>
        </div>
    </div>

    <div class="center-wrapper">

        <select id="cameraOption">
            <option value="" disabled selected>Choisir une caméra</option>
        </select>

        <div class="video-container">
            <video id="cameraStream" autoplay playsinline></video>
            <canvas id="photoCanvas" class="hidden"></canvas>
        </div>

        <input type="text" id="caption" class="textInput" placeholder="Entrez une légende" maxlength="100">

        <div class="buttons-box" id="capture">
            <button id="timerBtn" class="floating-button" aria-label="Minuterie" title="Retardateur (3sec)">
                <img src="/icons/timer-icon.svg" alt="minuteur">
            </button>
            <button id="photoButton" class="floating-button" aria-label="Photo mode" title="Prendre une photo">
                <img src="/icons/photo-icon.svg" alt="Photo icon">
            </button>
            <button id="importBtn" class="floating-button" aria-label="Import image" title="Importer une photo">
                <img src="/icons/import-icon.svg" alt="Import">
            </button>
            <button id="inverseBtn" class="floating-button" aria-label="Inverser l'image" title="Inverser l'image (preview)">
                <img src="/icons/inverse-icon.svg" alt="mirror">
            </button>
            <input type="file" id="importInput" accept="image/*" class="hidden">
        </div>

        <div class="buttons-box hidden" id="validation-buttons">
            <button id="valid" class="floating-button" title="Envoyer l'image">
                <img src="icons/check-icon.svg" alt="Valider">
            </button>
            <button id="delete" class="floating-button" title="Annuler">
                <img src="icons/cross-icon.svg" alt="Annuler">
            </button>
        </div>

        <div class="rooms-container">
            <div style="display: flex;">
                <input type="text" id="roomsInput" placeholder="Ajoutez une salle" maxlength="10" class="textInput">
                <input type="button" id="setRoomsBtn" value="Ajouter" class="add-room-button">
            </div>

            <div style="color: var(--title-color);">
                <a class="room-explanation-link" href="/rooms_guide"><i class="fa-solid fa-circle-info"></i>&nbsp;Fonctionnement des salles</a>
                <ul id="roomList">

                </ul>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="/client" class="top-btn">Client en ligne</a>
    </div>

    <div class="toolbox"></div>

    <a href="legal" class="legal">Legal</a>

    <script type="module" src="index.js"></script>
</body>
</html>
