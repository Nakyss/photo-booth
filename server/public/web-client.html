<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles/web-client.css">
    <title>Photo-booth Web</title>
</head>
<body style="margin: 0; padding: 0;">
    <div id="detect">
        <button id="settings">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>
    <div id="settings-window" style="display: none;">
        <div style="display: flex;">
            <input type="text" id="roomsInput" placeholder="Ajoutez une salle" maxlength="10" class="textInput">
            <input type="button" id="setRoomsBtn" value="Ajouter" class="add-room-button">
        </div>

        <div class="room-explanation-link">
            <a class="room-explanation-link" href="/rooms_guide">Fonctionnement des salles</a>
            <ul id="roomList">

            </ul>
       </div>
    </div>
    <div style="width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 2;" id="imageContainer">
    </div>

    <script type="module" src="web-client.js"></script>
</body>
</html>
