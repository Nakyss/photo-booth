<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icons/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Photo-booth Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #settings {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1;
            font-size: 1.3rem;
            transition: transform 0.2s ease;
            transform: translateX(-50px);
        }
        #settings:hover {
            color: #247a25;
        }
        #settings-window{
            position: absolute;
            top: 15px;
            left: 50px;
            background-color: #f3f3f3;
            border: 1px solid #ccc;
            padding: 10px;
            z-index: 1;
            border-radius: .5rem;
        }
        .room-explanation-link{
            color: #0c0c0c;
        }
        #roomList {
            margin: 5px;
            list-style: none;
            padding-left: 15px;
        }
        #detect {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
        }
        #detect:hover #settings {
            transform: translateX(0);
        }
    </style>
</head>
<body style="margin: 0; padding: 0;">
    <div id="detect">
        <button id="settings">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>
    <div id="settings-window" style="display: none;">
        <div style="display: flex;">
            <input type="text" id="roomsInput" placeholder="Ajoutez une salle" maxlength="10" class="textInput">
            <input type="button" id="setRoomsBtn" value="Ajouter" class="add-room-button">
        </div>

        <div style="color: var(--title-color);">
            <a class="room-explanation-link" href="/rooms_guide">Fonctionnement des salles</a>
            <ul id="roomList">

            </ul>
       </div>
    </div>
    <div style="width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 2;" id="imageContainer">
    </div>

    <script>
        const imageContainer = document.getElementById('imageContainer');
        let rooms = [];

        const displayImage = (url) => {
            const img = document.createElement('img');
            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "contain";
            img.src = url;
            img.style.opacity = "0";
            img.style.transition = "opacity 0.2s ease";
            img.onload = () => {
                img.style.opacity = "1";
                setTimeout(() => {
                    img.remove();
                }, 2500);
            }
            imageContainer.appendChild(img);
        };

        class PhotoBoothWebSocket {
            constructor(onImageReceived) {
                this.onImageReceived = onImageReceived;
                this.reconnectDelay = 2000;
                this.ws = null;
                this.shouldReconnect = true;
            }

            connect() {
                const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
                const wsUrl = `${protocol}://${location.host}/ws`;
                
                this.ws = new WebSocket(wsUrl);
                
                this.ws.addEventListener('open', () => this.onOpen(wsUrl));
                this.ws.addEventListener('message', (evt) => this.onMessage(evt));
                this.ws.addEventListener('close', (e) => this.onClose(e));
                this.ws.addEventListener('error', (err) => this.onError(err));
            }

            onOpen(wsUrl) {
                console.log('WebSocket connecté:', wsUrl);
                this.updateRooms(rooms);
            }

            onMessage(evt) {
                try {
                    const msg = JSON.parse(evt.data);
                    
                    if (msg.event === 'photo:broadcast' && msg.data?.image) {
                        console.log("Une Image a été envoyée");
                        console.log(msg.data.image, msg.data.message);
                        this.onImageReceived(msg.data.image);
                    } else {
                        console.debug('Message WS inconnu:', msg);
                    }
                } catch (e) {
                    console.warn('Impossible de parser le message WS:', e, evt.data);
                }
            }

            onClose(e) {
                console.warn('WebSocket fermé', e);
                
                if (this.shouldReconnect) {
                    console.log(`Tentative de reconnexion dans ${this.reconnectDelay}ms`);
                    setTimeout(() => this.connect(), this.reconnectDelay);
                }
            }

            onError(err) {
                console.error('Erreur WebSocket:', err);
                this.ws?.close();
            }

            disconnect() {
                this.shouldReconnect = false;
                this.ws?.close();
            }
            
            updateRooms(rooms) {
                if (this.ws?.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ event: 'room:changed', data: { rooms: JSON.stringify(rooms) } }));
                }
            }
        }

        // Initialisation
        const photoBoothWS = new PhotoBoothWebSocket(displayImage);
        photoBoothWS.connect();

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('DOMContentLoaded', () => {
            loadRooms();
            document.getElementById('settings').style.transform = 'translateX(0)';

            if (!isMobile) {
                setTimeout(() => {
                    document.getElementById('settings').style = null;
                }, 4000);
            }
        });

        const setRoomsBtn = document.getElementById('setRoomsBtn');
        const roomsInput = document.getElementById('roomsInput');

        document.getElementById('settings').addEventListener('click', () => {
            const settingsWindow = document.getElementById('settings-window');
            settingsWindow.style.display = settingsWindow.style.display === 'block' ? 'none' : 'block';
            if (settingsWindow.style.display === 'block') {
                renderRoomsList();
                document.getElementById('settings').style.transform = 'translateX(0)';
            }
            else {
                if (!isMobile){
                    document.getElementById('settings').style = null;
                }
            }
        });

        setRoomsBtn.addEventListener('click', async () => {
            const input = roomsInput.value.trim();
            if (input !== '') addRoom(input);
            else return;

            roomsInput.value = '';
            renderRoomsList();
        });

        roomsInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                setRoomsBtn.click();
            }
        });

        const removeRoom = (room) => {
            rooms = rooms.filter(r => r !== room);
            localStorage.setItem("clientRooms", JSON.stringify(rooms));
            photoBoothWS.updateRooms(rooms);
        }

        const addRoom = (room) => {
            if (!rooms.includes(room)) {
                rooms.push(room);
                localStorage.setItem("clientRooms", JSON.stringify(rooms));
                photoBoothWS.updateRooms(rooms);
            }
        }

        const loadRooms = () => {
            const storedRooms = localStorage.getItem("clientRooms");
            if (storedRooms) {
                rooms = JSON.parse(storedRooms);
            }
        }

        const renderRoomsList = () => {
            roomList.innerHTML = '';
            rooms.forEach(room => {
                const el = document.createElement('li');

                const button = document.createElement('button');
                button.innerHTML = '<i class="fa-solid fa-trash"></i>';
                button.style.marginLeft = '5px';
                button.addEventListener('click', () => {
                    roomList.removeChild(el);
                    removeRoom(room);
                });
                button.title = "Supprimer la salle";

                const text = document.createElement('span');
                text.textContent = room;

                el.appendChild(text);
                el.appendChild(button);
                roomList.appendChild(el);
            });
        }

    </script>
</body>
</html>
