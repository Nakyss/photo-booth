name: Deploy

on:
  push:
    branches:
      - "main"
    paths:
      - "server/**"

jobs:
  # 1. On appelle le linter défini dans l'autre fichier
  call-lint:
    uses: ./.github/workflows/lint.yml

  # 2. Analyse des changements
  check-changes:
    needs: call-lint # On attend que le lint soit validé
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.filter.outputs.src }}
      public-changed: ${{ steps.filter.outputs.public }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'server/src/**'
            public:
              - 'server/public/**'

  # 3. Redémarrage serveur
  restart-server:
    needs: [call-lint, check-changes]
    if: needs.check-changes.outputs.src-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Connect & execute script
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: nakyss.fr
          username: photo-booth
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          #known_hosts: ${{ secrets.SSH_KNOWN_HOST }}
          script: |
            set -e
            cd photo-booth
            . update.sh

  # 4. Update public uniquement
  update-public:
    needs: [call-lint, check-changes]
    if: needs.check-changes.outputs.public-changed == 'true' && needs.check-changes.outputs.src-changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Connect & git pull
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: nakyss.fr
          username: photo-booth
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          #known_hosts: ${{ secrets.SSH_KNOWN_HOST }}
          script: |
            set -e
            cd photo-booth
            git pull