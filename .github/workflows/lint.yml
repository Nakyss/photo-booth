name: Linting JS

on:
  push:
    branches: ["main"]
    paths: ["server/**"]
  pull_request:
    paths: ["server/**"]
  workflow_call:

jobs:
  run-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run Linter
        run: npm run lint
        working-directory: server